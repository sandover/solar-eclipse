<title>Solar Eclipse</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;600&display=swap">
<style>
:root{
  --ground:#131417; --panel:#1a1c20; --panel2:#202329; --rule:#2c2f36; --rule2:#3a3e47;
  --ink:#d8dae0; --ink2:#a4aab4; --dim:#868c96; --faint:#5c626c;
  --accent:#e9e2ce; --good:#8fae6b; --warn:#c98b4b;
  --serif:"IBM Plex Serif",Georgia,serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1220px;margin:0 auto;padding:0 28px}
a{color:var(--accent)}
h1,h2,h3{text-wrap:balance;margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}

.mast{border-bottom:1px solid var(--rule);padding:56px 0 0}
.mast-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:56px;align-items:end;padding-bottom:34px}
.mast h1{font-family:var(--serif);font-weight:600;font-size:clamp(38px,5.4vw,62px);line-height:1.02;letter-spacing:-.02em}
.mast h1 em{font-style:normal;color:var(--accent)}
.lede{color:var(--ink2);font-size:15.5px;max-width:62ch;margin-top:18px}
.lede b{color:var(--ink);font-weight:500}
.lede+.lede{margin-top:13px}
.spec{display:flex;flex-direction:column;border-left:1px solid var(--rule);padding-left:22px}
.spec .eyebrow{margin-bottom:10px}
.spec-row{display:flex;justify-content:space-between;gap:16px;padding:6px 0;border-bottom:1px dotted var(--rule);font-size:12.5px}
.spec-row:last-child{border-bottom:0}
.spec-row span:first-child{color:var(--dim)}
.spec-row span:last-child{font-family:var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}

.law{border-bottom:1px solid var(--rule);background:var(--panel)}
.law-in{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:40px;padding:30px 0;align-items:start}
.law h2{font-family:var(--serif);font-size:17px;font-weight:600;margin-bottom:7px}
.law p{color:var(--dim);font-size:12.5px;margin:0;max-width:40ch}
.ramp{display:grid;grid-template-columns:repeat(8,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule)}
.ramp div{background:var(--panel);padding:10px 9px}
.ramp .r-role{font-size:11.5px;color:var(--ink);font-weight:500;line-height:1.25}
.ramp .r-freq{font-size:10.5px;color:var(--faint);margin-top:2px}
.ramp .r-bar{height:4px;margin:9px 0 6px;border-radius:2px}
.ramp .r-num{font-family:var(--mono);font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums}

.mast{border-bottom:1px solid var(--rule)}
.bar{display:flex;align-items:baseline;gap:20px;flex-wrap:wrap;padding:16px 0 14px}
.bar h1{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:-.01em}
.facts{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px;
  color:var(--dim);font-variant-numeric:tabular-nums}
.rail{position:sticky;top:0;z-index:40;background:rgba(19,20,23,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.rail-in{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:11px 0}
.seg{display:inline-flex;border:1px solid var(--rule2);border-radius:2px;overflow:hidden}
.seg button{appearance:none;background:transparent;border:0;border-right:1px solid var(--rule2);color:var(--dim);
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:7px 13px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#17181b}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.rail-spacer{flex:1}
.jump{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);
  text-decoration:none;border-bottom:1px solid var(--rule2);padding-bottom:2px}
.jump:hover{color:var(--accent);border-color:var(--accent)}

.fam{padding:26px 0 6px}
.fam-head{border-bottom:1px solid var(--rule);padding-bottom:7px;margin-bottom:18px}
.fam-head h2{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:-.01em}
.fam-head p{margin:0;color:var(--dim);font-size:12.5px;max-width:64ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:26px}

.card{border:1px solid var(--rule);background:var(--panel);display:flex;flex-direction:column}
.card:hover{border-color:var(--rule2)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 16px 9px}
.card-head h3{font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:-.01em}
.card-head .tagline{color:var(--dim);font-size:12px;margin:5px 0 0;max-width:44ch}
.badge{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#17181b;
  background:var(--accent);padding:2px 6px;border-radius:1px;white-space:nowrap}
.flip{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);
  border:1px solid var(--rule2);padding:2px 6px;border-radius:1px;white-space:nowrap}
.ends{flex:none}
.win{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);overflow:hidden}
.win + .win{border-top:0}
.win-bar{display:flex;align-items:center;gap:7px;padding:7px 11px;font-family:var(--mono);font-size:10.5px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.win-title{margin-left:6px;opacity:.85}
.win-body{padding:13px 14px 16px;font-family:var(--mono);font-size:11.5px;line-height:1.72;min-height:200px}
.win + .win .win-body{min-height:0}
.code{display:grid;grid-template-columns:auto 1fr;column-gap:13px}
.ln{text-align:right;user-select:none}
.cur{margin:0 -14px;padding:0 14px}
.chat{font-family:var(--sans);font-size:12.5px;line-height:1.62;display:flex;flex-direction:column;gap:11px}
.bubble{padding:8px 11px;border-radius:3px;align-self:flex-end;max-width:78%}
.msg{display:flex;gap:9px}
.ava{width:17px;height:17px;border-radius:50%;flex:none;margin-top:2px}
.chat code,.md code{font-family:var(--mono);font-size:11px;padding:1px 4px;border-radius:2px}
.md{font-family:var(--sans);font-size:12.5px;line-height:1.62}
.md .h1{font-size:17px;font-weight:600;letter-spacing:-.01em;margin-bottom:2px}
.md .h2{font-size:13px;font-weight:600;margin:12px 0 3px}
.md .quote{border-left:2px solid;padding-left:10px;margin:9px 0;font-style:italic}
.md ul,.md ol{margin:5px 0;padding-left:19px}
.md .fence{font-family:var(--mono);font-size:10.5px;line-height:1.6;padding:7px 9px;
  border-radius:3px;margin:9px 0}
.md li{margin:1px 0}

.sw{display:flex;flex-direction:column;gap:4px;padding:12px 16px 4px}
.sw-cap{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint)}
.sw-row{display:grid;gap:5px}
.col{display:flex;flex-direction:column;gap:3px}
.plabel{font-family:var(--mono);font-size:7.5px;color:var(--faint);text-align:center;
  white-space:nowrap;overflow:hidden;line-height:1.1;margin-bottom:1px}
.chip{width:100%;height:20px;border:0;padding:0;cursor:pointer;position:relative;border-radius:2px}
.col input{-webkit-appearance:none;appearance:none;width:100%;height:3px;margin:0;padding:0;
  background:var(--rule2);border-radius:2px;cursor:pointer}
.col input::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:9px;border-radius:50%;
  background:var(--dim);border:0;cursor:pointer}
.col input::-moz-range-thumb{width:9px;height:9px;border:0;border-radius:50%;background:var(--dim);cursor:pointer}
.col input:hover::-webkit-slider-thumb,.col input:focus::-webkit-slider-thumb{background:var(--accent)}
.col input:hover::-moz-range-thumb,.col input:focus::-moz-range-thumb{background:var(--accent)}
.col input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.phex.out{color:var(--warn)}
.phex{font-family:var(--mono);font-size:8px;color:var(--faint);text-align:center;
  letter-spacing:-.03em;margin-top:1px}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chip::after{content:attr(data-l);position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:8.5px;opacity:0;transition:opacity .12s}
.chip:hover::after{opacity:.9}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px 14px}
.metrics{display:flex;gap:14px;font-family:var(--mono);font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.metrics b{color:var(--ink2);font-weight:500}
.btn{appearance:none;background:transparent;border:1px solid var(--rule2);color:var(--dim);font-family:var(--mono);
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;cursor:pointer;border-radius:2px;white-space:nowrap}
.btn:hover{color:var(--ink);border-color:var(--ink2)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.data{padding:40px 0 60px}
.data h2{font-family:var(--serif);font-size:19px;font-weight:600;margin-bottom:14px}
.data p{color:var(--dim);font-size:13px;margin:0 0 20px;max-width:76ch}
.scroll{overflow-x:auto;border:1px solid var(--rule)}
table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums}
th,td{padding:7px 12px;text-align:right;border-bottom:1px solid var(--rule);white-space:nowrap}
th{color:var(--dim);font-weight:500;font-size:10px;letter-spacing:.09em;text-transform:uppercase;background:var(--panel);position:sticky;top:0}
td:first-child,th:first-child{text-align:left}
tbody tr:hover{background:var(--panel)}
.sq{display:inline-block;width:10px;height:10px;border-radius:1px;margin-right:7px;vertical-align:-1px}
.foot{color:var(--faint);font-size:11.5px;margin-top:22px;max-width:78ch;line-height:1.7}

.spot{position:fixed;inset:0;z-index:90;background:rgba(10,11,13,.9);backdrop-filter:blur(6px);display:grid;place-items:center;padding:18px}
.spot-in{width:min(1340px,100%);max-height:100%;overflow:auto;border:1px solid var(--rule2);background:var(--panel)}
.spot-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:16px 20px;border-bottom:1px solid var(--rule)}
.spot-top h3{font-family:var(--serif);font-size:23px;font-weight:600}
.spot-body{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:0}
.spot-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.spot-cols .win{border-right:1px solid var(--rule);border-top:0;border-bottom:0}
.spot-cols .win:last-child{border-right:0}
.spot-cols .win-body{overflow-x:auto}
.spot-hex{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:1px;background:var(--rule);border-top:1px solid var(--rule)}
.spot-hex div{background:var(--panel);padding:9px 11px;font-family:var(--mono);font-size:10.5px;display:flex;align-items:center;gap:8px}
.spot-hex .k{color:var(--dim);display:block;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--accent);color:#17181b;
  font-family:var(--mono);font-size:11.5px;padding:7px 15px;border-radius:2px;z-index:120;pointer-events:none}
@media (max-width:980px){.law-in{grid-template-columns:1fr;gap:20px}.ramp{grid-template-columns:repeat(4,1fr)}}
@media (max-width:860px){
  .spec{border-left:0;border-top:1px solid var(--rule);padding-left:0;padding-top:18px}
  .grid{grid-template-columns:1fr}
  .spot-body{grid-template-columns:1fr}
  .wheelbox{border-right:0;border-bottom:1px solid var(--rule)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="mast"><div class="wrap bar">
  <h1>Solar Eclipse</h1>
  <span class="facts"><span>4 schemes</span><span>ground L*8&ndash;15</span>
  <span>text 4.75&ndash;5.70:1</span><span>comments 2.79:1</span><span>accents L*41&ndash;68</span></span>
</div></header>

  <span class="eyebrow">Colours</span>
  <div class="seg" id="refine">

  <span class="eyebrow" id="saveState" style="letter-spacing:.1em">&mdash;</span>

</div></nav>

<main class="wrap" id="families"></main>

<section class="data wrap" id="data">

    </tr></thead>
    <tbody id="tbody"></tbody>
  </table></div>
</section>

      '<span class="dot" style="background:var(--err)"></span>'+
      '<span class="dot" style="background:var(--ty)"></span>'+
      '<span class="dot" style="background:var(--kw)"></span>'+
      '<span class="win-title">'+TITLES[m]+'</span></div>'+
    '<div class="win-body">'+PREV[m]()+'</div></div>';
}
var tok = document.createElement('style');
tok.textContent = '.win .c{color:var(--base01)}.win .k{color:var(--kw)}.win .s{color:var(--str)}'+
  '.win .f{color:var(--fn)}.win .n{color:var(--num)}.win .t{color:var(--ty)}'+
  '.win .e{color:var(--err)}.win .m{color:var(--meta)}.win .p{color:var(--base0)}';
document.head.appendChild(tok);

/* merged roles share one colour, so one column drives both */
function columns(s, keys){
  var out=[], seen={};
  keys.forEach(function(k){
    var m = (s.roles[k] || {}).merged;
    if(m){
      if(seen[m]) return;
      seen[m] = 1;
      out.push({keys: keys.filter(function(x){ return (s.roles[x]||{}).merged === m; }), label: m});
    } else {
      out.push({keys: [k], label: LABEL[k]});
    }
  });
  return out;
}
function chips(s){
  var c = C(s);
  function row(keys){
    var cols = columns(s, keys);
    return '<div class="sw-row" style="grid-template-columns:repeat('+cols.length+',1fr)">'+
      cols.map(function(col){
        var k = col.keys[0], a = adj(s,k);
        var on = (k==='base03'||k==='base02'||k==='base01') ? c.base0 : c.base03;
        return '<div class="col" data-ks="'+col.keys.join(',')+'">'+
          '<span class="plabel">'+shortLabel(col.keys)+'</span>'+
          '<button class="chip" data-hex="'+c[k]+'" data-l="'+c[k].slice(1)+'" '+
            'title="'+col.label+' '+c[k]+'" aria-label="Copy '+col.label+' '+c[k]+'" '+
            'style="background:'+c[k]+';color:'+on+'"></button>'+
          '<input type="range" class="pl" min="-16" max="10" step="0.5" value="'+a[0]+
            '" title="'+col.label+' brightness" aria-label="'+col.label+' brightness">'+
          '<input type="range" class="pc" min="0.1" max="1.4" step="0.05" value="'+a[1]+
            '" title="'+col.label+' intensity" aria-label="'+col.label+' intensity">'+
          '<span class="phex">'+c[k].slice(1)+'</span></div>';
      }).join('')+'</div>';
  }
  var n = columns(s, ROLES.map(function(r){ return r[0]; })).length;
  return '<div class="sw">'+
    '<div class="sw-cap"><span>background to bright text</span><span>paper</span></div>'+row(BASE)+
    '<div class="sw-cap" style="margin-top:9px"><span>seen constantly</span>'+
      '<span>'+(n<8 ? n+' colours' : 'seen rarely')+'</span></div>'+
    row(ROLES.map(function(r){ return r[0]; }))+'</div>';
}

function card(s){
  return '<article class="card" data-name="'+s.name+'">'+
    '<div class="card-head"><div><h3>'+s.label+'</h3></div>'+
      '<div class="ends">'+(s.family==='control'?'<span class="badge">Yours</span>':
        (s.mirror<0?'<span class="flip">Wheel flipped</span>':''))+'</div></div>'+
    win(s,'code')+(MODE==='none' ? '' : win(s,MODE))+chips(s)+
    '<div class="card-foot"><div class="metrics">'+
      '<span>bg <b>'+C(s).base03+'</b></span>'+
      '<span>space <b>'+s.clear+'&deg;</b></span>'+
      '<span>contrast <b>'+s.c_body.toFixed(2)+':1</b></span>'+
    '</div><span style="display:flex;gap:7px">'+
    '<button class="btn" data-copyall="'+s.name+'">Copy 16</button>'+
    '<button class="btn" data-reset="'+s.name+'">Reset</button>'+
    '<button class="btn" data-spot="'+s.name+'">Look closer</button></span></div></article>';
}
var FAMS = [{test:function(s){ return s.family !== 'control'; }, title:''},
            {test:function(s){ return s.family === 'control'; }, title:''}];
function renderFamilies(){
  document.getElementById('families').innerHTML = FAMS.map(function(f){
    var list = S.filter(f.test);
    return '<section class="fam">'+(f.title ? '<div class="fam-head"><h2>'+f.title+'</h2></div>' : '')+
      '<div class="grid">'+list.map(card).join('')+'</div></section>';
  }).join('');
}
function repaint(name){
  var s = BY[name], cur = C(s), card = document.querySelector('.card[data-name="'+name+'"]');
  if(!card) return;
  Array.prototype.forEach.call(card.querySelectorAll('.win'), function(w){
    KEYS.forEach(function(k){ w.style.setProperty('--'+k, cur[k]); });
  });
  Array.prototype.forEach.call(card.querySelectorAll('.col'), function(col){
    var k = col.getAttribute('data-ks').split(',')[0], ch = col.querySelector('.chip');
    ch.style.background = cur[k];
    ch.setAttribute('data-hex', cur[k]);
    ch.setAttribute('data-l', cur[k].slice(1));
    ch.setAttribute('title', cur[k]);
    var px = col.querySelector('.phex');
    px.textContent = cur[k].slice(1);
    if(ROLEKEYS[k]){
      var lv = s.lch[k][0] + adj(s,k)[0];
      px.className = 'phex' + ((lv < s.lch.base01[0] || lv > s.lch.base0[0] + 0.2) ? ' out' : '');
    }
  });
  var mets = card.querySelectorAll('.metrics b');
  var ct = ratio(cur.base0, cur.base03);
  if(mets[0]) mets[0].textContent = cur.base03;
  if(mets[2]) mets[2].textContent = ct.toFixed(2) + ':1';
  if(mets[2]) mets[2].style.color = (ct < 4.2 || ct > 5.4) ? 'var(--warn)' : '';
}
function renderTable(){
  document.getElementById('tbody').innerHTML = S.map(function(s){
    return '<tr><td><span class="sq" style="background:'+s.colors.base03+'"></span>'+s.label+'</td>'+
      '<td>'+s.colors.base03+'</td><td>'+s.ground+'&deg;</td><td>'+s.paper+'&deg;</td>'+
      '<td>'+(s.mirror<0?'flipped':'normal')+'</td><td>'+s.clear+'&deg;</td><td>'+s.far.toFixed(2)+'</td>'+
      '<td>'+s.c_body.toFixed(2)+'</td><td>'+s.c_cmt.toFixed(2)+'</td><td>'+s.dE.toFixed(1)+'</td></tr>';
  }).join('');
}
function wheel(s){
  var cx=100, cy=100, out='';
  out += '<circle cx="100" cy="100" r="76" fill="none" stroke="#2c2f36"/>'+
         '<circle cx="100" cy="100" r="40" fill="none" stroke="#22252a"/>';
  function pt(h,r){ var a=h*Math.PI/180; return [cx+r*Math.cos(a), cy-r*Math.sin(a)]; }
  var g = pt(s.ground, 0);
  var ge = pt(s.ground, 88);
  out += '<line x1="100" y1="100" x2="'+ge[0].toFixed(1)+'" y2="'+ge[1].toFixed(1)+
         '" stroke="#3a3e47" stroke-dasharray="3 3"/>';
  ROLES.forEach(function(r){
    var m = s.roles[r[0]];
    var p = pt(m.hue, 34 + m.C*0.62);
    out += '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="7" fill="'+C(s)[r[0]]+
           '"><title>'+r[1]+' &mdash; '+m.dist+' degrees away</title></circle>';
  });
  out += '<circle cx="100" cy="100" r="15" fill="'+C(s).base03+'" stroke="#3a3e47"/>';
  return '<svg viewBox="0 0 200 200" role="img" aria-label="colour wheel">'+out+'</svg>';
}
function spotlight(name){
  var s = BY[name], c = C(s);
  var el = document.createElement('div');
  el.className = 'spot'; el.setAttribute('role','dialog'); el.setAttribute('aria-label',s.label);
  el.innerHTML = '<div class="spot-in"><div class="spot-top"><div><h3>'+s.label+'</h3>'+
    '</div>'+
    '<button class="btn" data-close="1">Close</button></div>'+
    '<div class="spot-body"><div class="wheelbox">'+wheel(s)+

    '</div><div class="spot-cols">'+win(s,'code')+win(s,'md')+win(s,'chat')+'</div></div>'+
    '<div class="spot-hex">'+KEYS.map(function(k){
      return '<div><span class="sq" style="background:'+c[k]+'"></span><span><span class="k">'+LABEL[k]+
             '</span>'+c[k]+'</span></div>'; }).join('')+'</div></div>';
  function close(){ el.remove(); document.removeEventListener('keydown', key);
                    renderFamilies(); }
  function key(e){ if(e.key === 'Escape') close(); }
  el.addEventListener('click', function(e){
    if(e.target === el || e.target.getAttribute('data-close')) close();
  });
  document.addEventListener('keydown', key);
  document.body.appendChild(el);
  el.querySelector('[data-close]').focus();
}
function toast(msg){
  var t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 1300);
}
document.addEventListener('click', function(e){
  var chip = e.target.closest('.chip');
  if(chip){
    var hex = chip.getAttribute('data-hex');
    try{ navigator.clipboard.writeText(hex); }catch(err){}
    toast(hex + ' copied'); return;
  }
  var rs = e.target.closest('[data-reset]');
  if(rs){
    var n = rs.getAttribute('data-reset');
    TUNE[n] = {};
    var card2 = document.querySelector('.card[data-name="'+n+'"]');
    Array.prototype.forEach.call(card2.querySelectorAll('.col'), function(cl){
      cl.querySelector('.pl').value = 0; cl.querySelector('.pc').value = 1;
    });
    save(); repaint(n);
    toast(BY[n].label + ' reset');
    return;
  }
  var ca = e.target.closest('[data-copyall]');
  if(ca){
    var s2 = BY[ca.getAttribute('data-copyall')], cur2 = C(s2);
    var txt = s2.label + '\n' + KEYS.map(function(k){
      return (LABEL[k] + '                ').slice(0,17) + cur2[k]; }).join('\n');
    try{ navigator.clipboard.writeText(txt); }catch(err){}
    toast(s2.label + ' palette copied');
    return;
  }
  var sp = e.target.closest('[data-spot]');
  if(sp){ spotlight(sp.getAttribute('data-spot')); return; }
  var rb = e.target.closest('#refine button');
  if(rb){
    REFINE = rb.getAttribute('data-refine') === '1';
    Array.prototype.forEach.call(document.querySelectorAll('#refine button'), function(b){
      b.setAttribute('aria-pressed', String(b === rb));
    });
    save(); renderFamilies(); return;
  }
  var mb = e.target.closest('#modes button');
  if(mb){
    MODE = mb.getAttribute('data-mode');
    Array.prototype.forEach.call(document.querySelectorAll('#modes button'), function(b){
      b.setAttribute('aria-pressed', String(b === mb));
    });
    save(); renderFamilies();
  }
});
document.addEventListener('input', function(e){
  var col = e.target.closest('.col');
  if(!col) return;
  var name = col.closest('.card').getAttribute('data-name');
  if(!TUNE[name]) TUNE[name] = {};
  var v = [parseFloat(col.querySelector('.pl').value), parseFloat(col.querySelector('.pc').value)];
  col.getAttribute('data-ks').split(',').forEach(function(k){ TUNE[name][k] = v; });
  save(); repaint(name);
});
Array.prototype.forEach.call(document.querySelectorAll('#modes button'), function(b){
  b.setAttribute('aria-pressed', String(b.getAttribute('data-mode') === MODE));
});
Array.prototype.forEach.call(document.querySelectorAll('#refine button'), function(b){
  b.setAttribute('aria-pressed', String((b.getAttribute('data-refine') === '1') === REFINE));
});
renderFamilies(); renderTable();

/* Choices are written to this artifact's own store, so they can be read back
   from outside the browser. Without it everything still works, locally only. */
if(window.claude && window.claude.use){
  window.claude.use('db').then(function(db){
    if(!db){ markSaved('this browser only'); return; }
    DB = db;
    markSaved('saved for Claude');
    return db.doc('settings/tuning').get().then(function(snap){
      if(snap && snap.exists && snap.data){
        applySaved(snap.data);
        Array.prototype.forEach.call(document.querySelectorAll('#modes button'), function(b){
          b.setAttribute('aria-pressed', String(b.getAttribute('data-mode') === MODE));
        });
        renderFamilies();
      }
    });
  }).catch(function(){ markSaved('this browser only'); });
} else { markSaved('this browser only'); }
})();
</script>
